<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Android下载提示 - 智悲佛网</title>
  <meta name="description" content="智悲佛网 Android 安装包下载说明：遇到风险提示或纯净模式拦截时的处理方法。">
  <meta name="theme-color" content="#0d1a10">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    body.page {
      padding: max(30px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(30px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .nav-back { margin-bottom: 20px; }

    .content-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      margin: auto 0;
      padding: 20px 0;
    }

    .tips-card {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(25px);
      backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 44px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      flex-shrink: 0;
    }

    .tips-card .main-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
    }

    .case-item { margin-bottom: 30px; }
    .case-item:last-child { margin-bottom: 0; }

    .case-label {
      font-size: 1.05rem;
      color: var(--text-faint);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .ui-mock-box {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .mock-check-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.85);
    }

    .mock-checkbox {
      width: 20px;
      height: 20px;
      background: var(--danger);
      color: #ffffff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .mock-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .mock-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .mock-blue-text {
      color: var(--link-blue);
      margin-left: 2px;
    }

    .action-guide {
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .action-guide .highlight-red {
      color: var(--danger);
      margin: 0 4px;
    }

    .right-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 28px;
    }

    .page-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.15;
      color: #ffffff;
    }

    .slogan-text {
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 1px;
    }

    .notice {
      max-width: 360px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 77, 79, 0.12);
      border: 1px solid rgba(255, 77, 79, 0.45);
      color: #ffffff;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .notice[hidden] { display: none; }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 220px;
      margin-top: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 400;
      transition: background 0.25s ease, border-color 0.25s ease;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffffff;
    }

    .version-info {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: -10px;
    }

    .version-info[hidden] { display: none; }

    .page-footer {
      margin-top: 0;
      padding-top: 20px;
    }

    @media (max-width: 980px) {
      .content-wrapper {
        flex-direction: column-reverse;
        gap: 36px;
      }

      .right-content {
        align-items: center;
        text-align: center;
      }

      .btn-group {
        max-width: 100%;
        flex-direction: row;
      }

      .btn { flex: 1; }

      .tips-card {
        padding: 32px 20px;
        max-width: 100%;
      }

      .tips-card .main-title { font-size: 1.35rem; }
      .action-guide { font-size: 1rem; }
    }
  </style>
</head>
<body class="page">

  <div class="container">
    <div class="nav-back">
      <a href="index.html"><svg class="icon" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
    </div>

    <div class="content-wrapper">

      <section class="tips-card">
        <h2 class="main-title">部分机型下载完成后，可能会进行风险提示</h2>

        <div class="case-item">
          <div class="case-label">情况一</div>
          <div class="ui-mock-box" aria-hidden="true">
            <div class="mock-check-group">
              <span class="mock-checkbox"><svg class="icon" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg></span>
              已了解应用的风险检测结果
            </div>
          </div>
          <div class="action-guide">
            请勾选后点击<span class="highlight-red">继续安装</span>完成安装
          </div>
        </div>

        <div class="case-item">
          <div class="case-label">情况二</div>
          <div class="ui-mock-box" aria-hidden="true">
            <div class="mock-title">纯净模式持续保护中</div>
            <div class="mock-desc">
              为提供更安全的服务以保护您的权益，建议优先安装经过应用市场检测的应用。<span class="mock-blue-text">了解纯净模式</span>
            </div>
          </div>
          <div class="action-guide">
            【设置】搜索【纯净模式】并点击关闭
          </div>
        </div>
      </section>

      <section class="right-content">
        <h1 class="page-title">Android下载提示</h1>

        <p class="slogan-text">
          如遇到下载没有开始，<br>
          请点击下方按钮重试
        </p>

        <p class="notice" id="wechatTip" role="alert" hidden>
          当前在微信 / QQ 内置浏览器中，无法直接下载安装包。请点击右上角「⋯」，选择「在浏览器中打开」后再下载。
        </p>

        <p class="notice" id="downloadError" role="alert" hidden>
          下载地址暂时不可用，请稍后重试。
        </p>

        <div class="btn-group">
          <a href="#" id="apkLink" class="btn" download>
            <svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M463.5 224H472c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8H463.5z"/></svg> 重新下载
          </a>
        </div>

        <p class="version-info" id="versionInfo" hidden></p>
      </section>

    </div>

    <footer class="page-footer">&copy; 2026 智悲佛网</footer>
  </div>

  <script>
    (function () {
      var link = document.getElementById('apkLink');
      var tip = document.getElementById('wechatTip');
      var err = document.getElementById('downloadError');
      var info = document.getElementById('versionInfo');
      var inAppBrowser = /MicroMessenger|QQ\//i.test(navigator.userAgent);
      var ready = false;

      link.addEventListener('click', function (e) {
        if (!ready) e.preventDefault();
      });

      function fail() {
        link.setAttribute('aria-disabled', 'true');
        err.hidden = false;
      }

      function autoDownload() {
        if (inAppBrowser) {
          tip.hidden = false;
          return;
        }
        var KEY = 'apk-auto-downloaded';
        try {
          if (sessionStorage.getItem(KEY)) return;
          sessionStorage.setItem(KEY, '1');
        } catch (e) { }
        setTimeout(function () { link.click(); }, 1000);
      }

      if (!window.fetch) { fail(); return; }

      fetch('version.json', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (d) {
          var version = d && d.version ? String(d.version).replace(/^v/i, '') : '';
          if (!version) return Promise.reject();
          link.href = '/releases/zhibeifw-' + encodeURIComponent(version) + '.apk';
          ready = true;
          info.textContent = '当前版本 v' + version;
          info.hidden = false;
          autoDownload();
        })
        .catch(fail);
    })();
  </script>

</body>
</html>
