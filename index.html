    html, body {

    .hero-container {

      isolation: isolate;

      padding-right: max(8vw, env(safe-area-inset-right));
      padding-top: max(40px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .hero-container::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(13, 26, 16, 0.65) 0%, rgba(13, 26, 16, 0.25) 55%, rgba(13, 26, 16, 0) 100%);
      pointer-events: none;
    }

    .hero-content {
      margin-block: auto;
      width: 100%;
      max-width: 720px;
    }

    .logo-header-group {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: clamp(38px, 6.5vh, 52px);
    }

    .hero-logo {
      width: clamp(6rem, 12vw, 11rem);
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.5));
    }

    .site-main-title {
      font-size: clamp(1.8rem, 3.2vw, 2.4rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.98);
      letter-spacing: 8px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .download-group {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 420px;
    }

    .download-btn {
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 5px;
      padding: 3px 0;
      border: 0;
      background: none;
      color: #ffffff;
      font: inherit;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .download-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .download-btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
      border-radius: 6px;
    }

    .download-icon {
      display: grid;
      place-items: center;
      width: clamp(46px, 13vw, 60px);
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-radius: 50%;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .download-btn:not(:disabled):hover .download-icon {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .download-icon .icon {
      width: 28px;
      height: 28px;
    }

    .download-label {
      font-size: clamp(0.82rem, 3.6vw, 0.94rem);
      font-weight: 500;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .hero-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 20px;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: #ffffff;
    }

    @media (max-width: 850px) {
      .hero-container {
        background-image: none;
        padding-left: max(6vw, env(safe-area-inset-left));
        padding-right: max(6vw, env(safe-area-inset-right));
      }

      .hero-container::before {
        display: none;
      }

      .hero-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .logo-header-group {

        gap: 20px;
      }

      .hero-footer {

        justify-content: center;
        text-align: center;
        padding-bottom: 10px;
      }
    }

  <script>
    (function () {
      const root = document.documentElement;
      document.addEventListener('pointerdown', () => {
        root.dataset.focusInput = 'pointer';
      }, { capture: true, passive: true });
      document.addEventListener('keydown', event => {
        if (event.key === 'Tab') root.dataset.focusInput = 'keyboard';
      }, true);

      const dialog = document.getElementById('platform-dialog');
      if (typeof dialog.showModal !== 'function') return;

      const title = document.getElementById('platform-title');
      const groups = dialog.querySelectorAll('[data-platform-options]');
      for (const trigger of document.querySelectorAll('[data-platform]')) {
        trigger.setAttribute('aria-haspopup', 'dialog');
        trigger.setAttribute('aria-controls', dialog.id);
        if (trigger instanceof HTMLButtonElement) trigger.disabled = false;

        trigger.addEventListener('click', event => {
          event.preventDefault();
          title.textContent = trigger.querySelector('.download-label').textContent;
          for (const group of groups) group.hidden = group.dataset.platformOptions !== trigger.dataset.platform;
          trigger.focus({ preventScroll: true });
          dialog.showModal();
        });
      }

      dialog.addEventListener('click', event => {
        if (event.target === dialog && dialog.open) {
          const { left, right, top, bottom } = dialog.getBoundingClientRect();
          if (event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom) dialog.close();
        }
      });
    })();
  </script>
