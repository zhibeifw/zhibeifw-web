  <style>
    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-hero);
      color: #ffffff;
    }

    .hero-container {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-image: url('khenposodargye.jpg');
      background-size: cover;
      background-position: center right;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-left: max(9vw, env(safe-area-inset-left));
      padding-right: max(8vw, env(safe-area-inset-right));
      padding-top: max(40px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .hero-container::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(13, 26, 16, 0.65) 0%, rgba(13, 26, 16, 0.25) 55%, rgba(13, 26, 16, 0) 100%);
      pointer-events: none;
    }

    .hero-content {
      margin-block: auto;
      width: 100%;
      max-width: 720px;
    }

    .logo-header-group {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: clamp(38px, 6.5vh, 52px);
    }

    .hero-logo {
      width: clamp(6rem, 12vw, 11rem);
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.5));
    }

    .site-main-title {
      font-size: clamp(1.8rem, 3.2vw, 2.4rem);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.98);
      letter-spacing: 8px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .download-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 13px 26px;
      min-width: 215px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .download-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .download-btn .icon {
      font-size: 2.1rem;
      width: 28px;
      opacity: 0.95;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .btn-text .small-text {
      font-size: 0.7rem;
      font-weight: 300;
      opacity: 0.85;
      line-height: 1.1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .btn-text .big-text {
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.25;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .hero-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 20px;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: #ffffff;
    }

    @media (max-width: 850px) {
      .hero-container {
        background-image: none;
        padding-left: max(6vw, env(safe-area-inset-left));
        padding-right: max(6vw, env(safe-area-inset-right));
      }

      .hero-container::before {
        display: none;
      }

      .hero-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .logo-header-group {
        justify-content: center;
        gap: 20px;
      }

      .download-group {
        justify-content: center;
        flex-direction: column;
        width: 100%;
      }

      .download-btn {

        max-width: 280px;
        justify-content: center;
      }

      .hero-footer {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        padding-bottom: 10px;
      }
    }
  </style>
</head>
