  <title>联系我们 - 智悲佛网</title>

  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .card .icon {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 300;
    }

    .card a.btn {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .card a.btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .contact-detail {
      display: inline-block;
      margin-top: 6px;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
  </style>
</head>
